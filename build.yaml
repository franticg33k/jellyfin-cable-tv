# Plugin manifest for jprm (Jellyfin plugin repository manager).
name: "Cable TV"
guid: "ddef6196-173c-4477-b5e8-72811d8d96e4"
version: "0.5.4.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Scheduled, always-on channels built from your library"
description: >
  Builds cable-style channels from your libraries, collections, playlists, genres, networks, decades and
  title lists on a deterministic schedule, publishes them to Live TV with logos and a guide, and exposes a
  schedule API for clients that tune in instantly by direct-playing at the right offset.
category: "LiveTV"
owner: "franticg33k"
artifacts:
  - "Jellyfin.Plugin.CableTv.dll"
changelog: >
  0.5.4.0: Cable TV has its own entry in the dashboard sidebar, under Plugins.
  0.5.3.0: web TV plays each channel's Live TV stream, the same one Jellyfin's Live TV player uses, instead of
  transcoding the scheduled files itself, which failed for some files; the channel list returns each channel's
  Live TV id (liveTvId).
  0.5.2.0: web TV video plays: it joins programmes by seeking in the player, since Jellyfin 12 rejects a start
  offset on HLS segments, and the page is no longer cached across updates. Live TV clients that remux to HLS
  (live.m3u8, e.g. Fathom) play Cable TV channels: copied video and its audio start at the same keyframe, so
  Jellyfin sees the audio track.
  0.5.1.0: web TV sends the stream key the way Jellyfin 12 expects, asks for a key press when the browser blocks
  autoplay, shows a no-signal card with retries instead of endless static, and Enter signs in.
  0.5.0.0: stream (HLS/URL), weather and music channels; trailer channels ("Coming attractions") and trailer
  sources; artist sources and music suggestions; content groups; a browser TV page at /CableTv/Web; commercials
  pre-converted by a scheduled task; a configurable service name; the guide folds songs and trailers into blocks.
  0.4.1.0: faster schedules (cached cycle order, allocation-free commercial picks), a light /CableTv/Guide endpoint,
  channels built right after start-up, cacheable logos; slots carry year, rating and a movie flag.
  0.4.0.0: channel suggestions, quick channels, lineup CSV and channel pack import/export, seasonal and
  pinned-episode imports, more source types with exclusions, channel logos, guide categories, faster rebuilds.
