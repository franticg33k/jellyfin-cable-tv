# Plugin manifest for jprm (Jellyfin plugin repository manager).
name: "Cable TV"
guid: "ddef6196-173c-4477-b5e8-72811d8d96e4"
version: "0.4.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Scheduled, always-on channels built from your library"
description: >
  Builds cable-style channels from your libraries, collections, playlists, genres, networks, decades and
  title lists on a deterministic schedule, publishes them to Live TV with logos and a guide, and exposes a
  schedule API for clients that tune in instantly by direct-playing at the right offset.
category: "LiveTV"
owner: "franticg33k"
artifacts:
  - "Jellyfin.Plugin.CableTv.dll"
changelog: >
  0.4.0.0: channel suggestions from your library (networks, genres, decades, kids, holidays, collections),
  quick channels, lineup CSV and channel pack import/export, seasonal and pinned-episode imports, title,
  network, tag, rating, year and keyword sources with exclusions, channel logos (network logos, logo packs,
  generated), guide categories, and faster rebuilds for large libraries.
