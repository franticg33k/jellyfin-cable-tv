name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test -c Release
      - name: Package
        run: python3 scripts/package.py --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cabletv_*.zip
            dist/manifest.json
