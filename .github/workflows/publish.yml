# Publishes a new plugin version whenever build.yaml's version changes on main (or on demand):
# builds and tests, uploads the zip to a GitHub release tagged v<version>, and commits the updated
# dist/manifest.json, the plugin repository Jellyfin servers read. Nothing happens when the release exists.
name: Publish

on:
  push:
    branches: [main]
    paths: ["build.yaml", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*"?([0-9.]+)"?.*/\1/p' build.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.exists != 'true'
        with:
          dotnet-version: "10.0.x"
      - name: Test
        if: steps.version.outputs.exists != 'true'
        run: dotnet test -c Release
      - name: Package
        if: steps.version.outputs.exists != 'true'
        run: python3 scripts/package.py --merge
      - name: Create release
        if: steps.version.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Cable TV ${{ steps.version.outputs.version }}
          body: |
            Add `https://raw.githubusercontent.com/${{ github.repository }}/main/dist/manifest.json` under
            Dashboard → Plugins → Repositories to install and update from your server, or unzip this file into
            `<jellyfin config>/plugins/Cable TV_${{ steps.version.outputs.version }}/`.
          files: dist/cabletv_${{ steps.version.outputs.version }}.zip
      - name: Commit the manifest
        if: steps.version.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/manifest.json
          git commit -m "Publish Cable TV ${{ steps.version.outputs.version }} to the plugin repository [skip ci]"
          git push origin HEAD:main
