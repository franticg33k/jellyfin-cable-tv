name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet publish src/Jellyfin.Plugin.CableTv -c Release -o artifacts/plugin --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.CableTv
          path: artifacts/plugin/Jellyfin.Plugin.CableTv.dll
