<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cable TV</title>
<style>
  :root { --bg:#1b3a55; --top:#0e2538; --cell:#4b6c8b; --movie:#7b5b8b; --kids:#5b8a5b; --focus:#f5e5a2; --focusText:#14202c; --accent:#e9c648; --text:#fff; --muted:#c7d2df; --chw:clamp(84px,12vw,220px); }
  @media (max-width: 760px) { :root { --chw:clamp(78px,26vw,130px); } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; -webkit-tap-highlight-color:transparent; background:#000; color:var(--text); font-family: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace; overflow:hidden; }
  #screen { position:fixed; inset:0; background:#000; touch-action:manipulation; }
  video { width:100%; height:100%; object-fit:contain; background:#000; }
  #static { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; display:none; }
  #card { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:linear-gradient(var(--top), var(--bg)); text-align:center; }
  #card h1 { color:var(--accent); margin:.2em 0; font-size:clamp(22px,5vh,60px); padding:0 4vw; }
  #banner { position:absolute; left:0; right:0; bottom:0; padding:4vh 4vw calc(3vh + env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(0,0,0,.9)); display:none; }
  #banner .num { color:var(--accent); font-size:clamp(26px,6vh,72px); font-weight:bold; }
  #banner .row { display:flex; justify-content:space-between; align-items:flex-end; gap:2vw; }
  .label { color:var(--accent); font-size:clamp(11px,1.6vh,16px); letter-spacing:.1em; }
  .title { font-size:clamp(18px,3.2vh,40px); font-weight:bold; }
  .sub { color:var(--muted); font-size:clamp(13px,2vh,22px); }
  .bar { height:.8vh; background:rgba(255,255,255,.3); border-radius:.4vh; margin-top:1.2vh; }
  .bar > div { height:100%; background:var(--accent); border-radius:.4vh; }
  #digits { position:absolute; top:calc(4vh + env(safe-area-inset-top)); left:4vw; font-size:clamp(36px,8vh,96px); color:var(--accent); background:rgba(0,0,0,.6); padding:0 2vw; border-radius:1vh; display:none; }
  #guide { position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column; }
  #guide header { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; padding:calc(1vh + env(safe-area-inset-top)) 2vw 1vh; background:var(--top); }
  #guide header b { color:var(--accent); font-size:clamp(16px,2.6vh,30px); }
  #times, .grow { display:flex; }
  #times { background:var(--top); height:clamp(26px,4vh,40px); align-items:center; font-size:clamp(12px,1.8vh,18px); }
  #times div { flex:0 0 auto; border-left:1px solid #455667; padding-left:.6vw; }
  #rows { flex:1; overflow-y:auto; position:relative; }
  .grow { height:clamp(50px,7vh,80px); margin:2px 0; }
  .chan { flex:0 0 var(--chw); background:#02203f; padding:.6vh 6px .6vh 8px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer; position:relative; }
  .chan b { display:block; font-size:clamp(14px,2.2vh,24px); }
  .chan .star { position:absolute; right:4px; top:2px; font-size:clamp(14px,2vh,20px); color:var(--accent); padding:2px 4px; }
  .chan span { color:var(--muted); font-size:clamp(11px,1.5vh,16px); }
  .cells { position:relative; flex:1; }
  .cell { position:absolute; top:0; bottom:0; background:var(--cell); border-radius:.4vh; padding:.5vh 6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:clamp(12px,1.8vh,18px); border:2px solid transparent; cursor:pointer; }
  .cell small { display:block; color:var(--muted); font-size:clamp(10px,1.4vh,14px); overflow:hidden; text-overflow:ellipsis; }
  .cell.movie { background:var(--movie); } .cell.kids { background:var(--kids); } .cell.off { background:#2b3b4b; }
  .cell.focus { background:var(--focus); color:var(--focusText); border-color:#fff; } .cell.focus small { color:var(--focusText); }
  .grow.current .chan { background:#3e5f55; box-shadow: inset 4px 0 var(--accent); }
  #now { position:absolute; top:0; bottom:0; width:2px; background:rgba(233,198,72,.6); pointer-events:none; }
  #help { color:var(--muted); font-size:clamp(11px,1.6vh,16px); }
  #hint { background:var(--top); padding:1vh 2vw calc(1vh + env(safe-area-inset-bottom)); min-height:clamp(44px,7vh,70px); font-size:clamp(13px,2vh,20px); display:flex; gap:12px; align-items:center; justify-content:space-between; }
  #hint .what { overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  #hint button { flex:0 0 auto; }
  #hint .what small { display:block; color:var(--muted); font-size:.8em; }
  button.btn, select.btn { font:inherit; font-size:clamp(14px,2vh,18px); min-height:40px; min-width:40px; padding:4px 12px; border-radius:8px; border:1px solid #455667; background:#02203f; color:#fff; cursor:pointer; }
  button.btn:active { background:#14405f; }
  button.btn.primary { background:var(--accent); color:var(--focusText); border-color:var(--accent); font-weight:bold; }
  #guide .tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #controls { position:absolute; top:0; left:0; right:0; display:none; align-items:center; gap:6px; flex-wrap:wrap; padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 24px calc(8px + env(safe-area-inset-left)); background:linear-gradient(rgba(0,0,0,.85), transparent); }
  #controls #chLabel { flex:1; text-align:center; font-size:clamp(14px,2.2vh,22px); color:var(--accent); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-width:80px; }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:4vw; font-size:clamp(16px,2.4vh,26px); }
  #msg a { color:var(--accent); }
  #login { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:linear-gradient(var(--top), var(--bg)); }
  #login form { background:rgba(0,0,0,.35); padding:4vh 24px; border-radius:12px; display:flex; flex-direction:column; gap:12px; width:min(92vw,380px); }
  #login h1 { color:var(--accent); margin:0 0 1vh; font-size:3.5vh; }
  #login input, #login button { font:inherit; font-size:clamp(16px,2.2vh,24px); padding:10px 12px; border-radius:8px; border:1px solid #455667; background:#02203f; color:#fff; }
  #login button { background:var(--accent); color:var(--focusText); font-weight:bold; cursor:pointer; }
  #loginError { color:#ff8a80; min-height:1.4em; }
  @media (max-width: 760px) { #help, #clock { display:none; } #controls #chLabel { order:-1; flex:1 0 100%; text-align:left; } }
</style>
</head>
<body>
<div id="screen">
  <video id="video" autoplay playsinline></video>
  <canvas id="static" width="192" height="108"></canvas>
  <div id="card"><div id="cardLogo"></div><h1 id="cardTitle"></h1><div class="sub" id="cardSub"></div></div>
  <div id="banner"></div>
  <div id="controls">
    <button class="btn" id="btnDown" aria-label="Channel down">&#9660; CH</button>
    <span id="chLabel"></span>
    <button class="btn" id="btnUp" aria-label="Channel up">CH &#9650;</button>
    <button class="btn primary" id="btnGuide">Guide</button>
    <button class="btn" id="btnFav" aria-label="Favourite channel">&#9734;</button>
    <button class="btn" id="btnMute" aria-label="Mute">Mute</button>
    <button class="btn" id="btnFull" aria-label="Full screen">&#9974;</button>
  </div>
  <div id="digits"></div>
  <div id="guide">
    <header>
      <b id="service">CABLE TV</b>
      <span class="tools">
        <select class="btn" id="category" aria-label="Channel group"></select>
        <button class="btn" id="gEarlier" aria-label="Earlier">&#9664;</button>
        <button class="btn" id="gNow">Now</button>
        <button class="btn" id="gLater" aria-label="Later">&#9654;</button>
        <button class="btn" id="gClose" aria-label="Close guide">&#10005;</button>
      </span>
      <span id="help">↑↓ channels · ←→ time · Enter watch · * favourite · Esc close · 0-9 tune</span><span id="clock"></span>
    </header>
    <div id="times"></div>
    <div id="rows"></div>
    <div id="hint"><span class="what" id="hintText"></span><button class="btn primary" id="hintWatch" style="display:none">Watch</button></div>
  </div>
  <div id="msg"></div>
  <div id="login"><form id="loginForm">
    <h1 id="loginTitle">CABLE TV</h1>
    <input id="loginUser" autocomplete="username" placeholder="Jellyfin user name" required>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Password">
    <button type="submit">Sign in</button>
    <div id="loginError"></div>
  </form></div>
</div>
<script src="hls.js"></script>
<script>
(function () {
  'use strict';
  var base = location.pathname.split('/CableTv/')[0];
  var token = null, userId = null;
  try {
    // Our own sign-in first, then the Jellyfin web client's remembered session.
    var own = JSON.parse(localStorage.getItem('cabletv_web_auth') || 'null');
    if (own && own.token) { token = own.token; userId = own.userId; }
  } catch (e) { /* none */ }
  if (!token) try {
    var creds = JSON.parse(localStorage.getItem('jellyfin_credentials') || '{}');
    var servers = (creds.Servers || []).filter(function (s) { return s.AccessToken; });
    var mine = servers.filter(function (s) { return [s.ManualAddress, s.LocalAddress, s.RemoteAddress].some(function (a) { return a && a.indexOf(location.host) >= 0; }); })[0] || servers[0];
    if (mine) { token = mine.AccessToken; userId = mine.UserId; }
  } catch (e) { /* not signed in */ }

  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), hls = null;
  var channels = [], guide = {}, current = 0, digits = '', digitTimer = null, bannerTimer = null, now = null, next = [];
  var windowStart = 0, focusRow = 0, focusCol = 0, serverOffset = 0;
  var HALF = 30 * 60000;
  // Half-hour columns the guide shows: two on a phone, four on anything wider.
  function slots() { return window.innerWidth < 760 ? 2 : 4; }
  var category = '', favs = [];
  try { favs = JSON.parse(localStorage.getItem('cabletv_web_favs') || '[]'); } catch (e) { /* none */ }
  function isFav(id) { return favs.indexOf(id) >= 0; }
  function toggleFav(id) {
    var i = favs.indexOf(id); if (i >= 0) favs.splice(i, 1); else favs.push(id);
    try { localStorage.setItem('cabletv_web_favs', JSON.stringify(favs)); } catch (e) { /* session only */ }
    updateControls(); if (guideOpen()) { buildCategories(); if (!visible(focusRow)) focusRow = firstVisible(); renderGuide(); }
  }
  function guideOpen() { return $('guide').style.display === 'flex'; }
  // The guide's group filter: all channels, favourites, or one of the plugin's categories.
  function visible(r) {
    var c = channels[r]; if (!c) return false;
    return !category || (category === '\u2605' ? isFav(c.channelId) : c.category === category);
  }
  function firstVisible() { for (var r = 0; r < channels.length; r++) if (visible(r)) return r; return 0; }
  function stepRow(from, dir) { for (var r = from + dir; r >= 0 && r < channels.length; r += dir) if (visible(r)) return r; return from; }
  function buildCategories() {
    var sel = $('category'), cats = [];
    channels.forEach(function (c) { if (c.category && cats.indexOf(c.category) < 0) cats.push(c.category); });
    var opts = [['', 'All channels']];
    if (favs.length) opts.push(['\u2605', '\u2605 Favourites']);
    cats.forEach(function (c) { opts.push([c, c]); });
    if (!opts.some(function (o) { return o[0] === category; })) category = '';
    sel.innerHTML = '';
    opts.forEach(function (o) { var el = document.createElement('option'); el.value = o[0]; el.textContent = o[1]; sel.appendChild(el); });
    sel.value = category; sel.style.display = opts.length > 1 ? '' : 'none';
  }

  function show(el, on, display) { el.style.display = on ? (display || 'block') : 'none'; }
  function message(html) { $('msg').innerHTML = html; show($('msg'), true, 'flex'); }
  function nowMs() { return Date.now() + serverOffset; }
  function time(ms) { return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

  function api(path, query) {
    var qs = Object.keys(query || {}).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(query[k]); }).join('&');
    return fetch(base + '/' + path + (qs ? '?' + qs : ''), { headers: { Authorization: 'MediaBrowser Client="Cable TV Web", Device="Browser", DeviceId="cabletv-web", Version="1", Token="' + token + '"' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (json) { if (json.serverTime) serverOffset = Date.parse(json.serverTime) - Date.now(); return json; });
  }

  // ---- static ----
  var staticTimer = null;
  function setStatic(on) {
    var canvas = $('static'); show(canvas, on);
    clearInterval(staticTimer);
    if (!on) return;
    var ctx = canvas.getContext('2d'), img = ctx.createImageData(192, 108);
    staticTimer = setInterval(function () {
      for (var i = 0; i < img.data.length; i += 4) { var v = Math.random() * 255; v = v < 110 ? 16 : v; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
      ctx.putImageData(img, 0, 0);
    }, 60);
  }

  // ---- playback ----
  var blocked = false, retryTimer = null;
  function stop() { clearTimeout(retryTimer); if (hls) { hls.destroy(); hls = null; } video.removeAttribute('src'); video.load(); }
  // Browsers only start sound after the user has interacted with the page (a reload with a saved sign-in hasn't).
  function startPlayback() {
    video.play().then(function () { blocked = false; }).catch(function (e) {
      if (e && e.name === 'NotAllowedError') {
        blocked = true; setStatic(false);
        card(channels[current], 'PRESS ANY KEY TO TUNE IN', 'Your browser starts video once you click or press a key.');
      }
    });
  }
  function resume() {
    if (!blocked) return false;
    blocked = false; show($('card'), false); startPlayback();
    return true;
  }
  // A problem retrying won't fix: say so once and stop tuning again and again.
  function noSignalFinal(detail) {
    stop(); closeLive(); setStatic(false);
    card(channels[current], 'CAN\'T PLAY HERE', detail);
  }
  function noSignal(detail) {
    stop(); closeLive(); setStatic(false);
    card(channels[current], 'NO SIGNAL', detail + ' Trying again shortly.');
    retryTimer = setTimeout(function () { tune(current); }, 10000);
  }
  // Jellyfin sends H.264 video and AAC audio. Some Chromium builds (Brave or Chromium from a Linux package, Snap or
  // Flatpak, for example) ship without those codecs and can't play them, whatever the page does.
  var CODEC_HELP = 'This browser can\'t play H.264/AAC video, which the stream uses. Try Firefox, Chrome or Edge, or a build of this browser with proprietary media codecs.';
  function codecsSupported() {
    if (video.canPlayType('application/vnd.apple.mpegurl')) return true;
    var types = ['video/mp4; codecs="avc1.64001f,mp4a.40.2"', 'video/mp4; codecs="avc1.42E01E,mp4a.40.2"'];
    return !!(window.MediaSource && types.some(function (t) { return MediaSource.isTypeSupported(t); }));
  }
  function playUrl(url) {
    stop();
    if (url.indexOf('.m3u8') >= 0 && !video.canPlayType('application/vnd.apple.mpegurl') && window.Hls && Hls.isSupported()) {
      hls = new Hls({ maxBufferLength: 20 });
      hls.on(Hls.Events.ERROR, function (event, data) {
        if (!data.fatal) return;
        var status = data.response && data.response.code;
        var detail = [data.details, status ? 'HTTP ' + status : ''].filter(Boolean).join(', ');
        console.warn('Cable TV playback error', data);
        if (status === 401 || status === 403) noSignal('The server refused the stream (sign in again if this persists).');
        else if (/codec|bufferAdd/i.test(String(data.details)) || !codecsSupported()) noSignal(CODEC_HELP + ' (' + detail + ')');
        else noSignal('The stream could not be played (' + detail + ').');
      });
      hls.loadSource(url); hls.attachMedia(video);
    } else {
      video.src = url;
    }
    startPlayback();
  }
  function card(channel, title, sub) {
    $('cardLogo').innerHTML = channel && channel.logoUrl ? '<img src="' + channel.logoUrl + '" style="max-height:18vh;max-width:40vw">' : '';
    $('cardTitle').textContent = title; $('cardSub').textContent = sub || '';
    show($('card'), true, 'flex');
  }

  // The page plays each channel's Live TV stream, exactly as Jellyfin's own Live TV player does: Jellyfin opens the
  // plugin's continuous stream and hands back an HLS URL it transcodes to what the browser can play.
  var PROFILE = {
    MaxStreamingBitrate: 40000000,
    DirectPlayProfiles: [],
    TranscodingProfiles: [{ Container: 'ts', Type: 'Video', VideoCodec: 'h264', AudioCodec: 'aac', Protocol: 'hls', Context: 'Streaming', MaxAudioChannels: '2', MinSegments: 1, BreakOnNonKeyFrames: true }]
  };
  var liveStreamId = null, tuneSeq = 0;
  function authHeaders() { return { Authorization: authHeader + ', Token="' + token + '"', 'Content-Type': 'application/json' }; }
  function closeLive() {
    if (!liveStreamId) return;
    fetch(base + '/LiveStreams/Close?liveStreamId=' + encodeURIComponent(liveStreamId), { method: 'POST', headers: authHeaders(), keepalive: true }).catch(function () {});
    liveStreamId = null;
  }
  function refreshNow(channel) {
    return api('CableTv/Now', { channelId: channel.channelId, next: 3 }).then(function (r) {
      if (channel !== channels[current]) return;
      now = r.current; next = r.next; showBanner();
    }).catch(function () { now = null; next = []; });
  }

  function tune(index) {
    if (!channels.length) return;
    current = (index + channels.length) % channels.length;
    var channel = channels[current], seq = ++tuneSeq;
    show($('card'), false); setStatic(true); stop(); closeLive();
    refreshNow(channel);
    if (!codecsSupported()) { noSignalFinal(CODEC_HELP); return; }
    if (!channel.liveTvId) { noSignal('This channel isn\'t in Live TV yet: run "Refresh Guide" in Scheduled Tasks.'); return; }
    var q = 'UserId=' + userId + '&IsPlayback=true&AutoOpenLiveStream=true&StartTimeTicks=0&MaxStreamingBitrate=' + PROFILE.MaxStreamingBitrate;
    fetch(base + '/Items/' + channel.liveTvId + '/PlaybackInfo?' + q, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ DeviceProfile: PROFILE }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (info) {
        var source = (info.MediaSources || [])[0];
        if (seq !== tuneSeq) { if (source && source.LiveStreamId) { liveStreamId = source.LiveStreamId; closeLive(); } return; }
        if (!source || !(source.TranscodingUrl || source.Path)) throw new Error('no stream');
        liveStreamId = source.LiveStreamId || null;
        playUrl(source.TranscodingUrl ? base + source.TranscodingUrl : source.Path);
      })
      .catch(function () { if (seq === tuneSeq) noSignal('The channel could not be tuned.'); });
  }
  video.addEventListener('playing', function () { setStatic(false); });
  video.addEventListener('waiting', function () { setStatic(true); });
  video.addEventListener('ended', function () { tune(current); });
  video.addEventListener('error', function () { if (!hls) noSignal('The stream could not be played' + (video.error && video.error.message ? ' (' + video.error.message + ')' : '') + '.'); });
  window.addEventListener('pagehide', closeLive);
  // The stream plays on through breaks and programmes; only the banner's "now playing" needs refreshing.
  setInterval(function () { if (now && nowMs() >= Date.parse(now.end)) { now = null; refreshNow(channels[current]); } }, 1000);

  function showBanner() {
    var c = channels[current], b = $('banner');
    if (!now) return;
    var start = Date.parse(now.start), end = Date.parse(now.end), p = Math.min(100, Math.max(0, (nowMs() - start) / (end - start) * 100));
    var nx = next.filter(function (s) { return s.kind === 'program'; })[0];
    b.innerHTML = '<div class="row"><div><div class="label">NOW PLAYING</div><div class="title"></div><div class="sub"></div></div>' +
      '<div style="text-align:right"><div class="num"></div><div class="sub cname"></div></div></div><div class="bar"><div style="width:' + p + '%"></div></div>' +
      (nx ? '<div class="sub" style="margin-top:1vh">COMING UP · ' + time(Date.parse(nx.start)) + ' <span class="nx"></span></div>' : '');
    b.querySelector('.title').textContent = now.title || c.name;
    b.querySelector('.sub').textContent = [now.episode, now.episodeTitle].filter(Boolean).join(' - ');
    b.querySelector('.num').textContent = c.number; b.querySelector('.cname').textContent = c.name;
    if (nx) b.querySelector('.nx').textContent = nx.title || '';
    show(b, true); clearTimeout(bannerTimer); bannerTimer = setTimeout(function () { show(b, false); }, 6000);
  }

  // ---- guide ----
  function loadGuide() {
    var start = nowMs(); start -= start % HALF;
    return api('CableTv/Guide', { from: new Date(start).toISOString(), to: new Date(start + 6 * 3600000).toISOString() }).then(function (r) {
      guide = {}; r.channels.forEach(function (c) { guide[c.channelId] = c.programs; });
      if (!windowStart) windowStart = start;
    });
  }
  function renderGuide() {
    var n = slots(), wEnd = windowStart + n * HALF, times = $('times'), rows = $('rows');
    times.innerHTML = '<div style="flex:0 0 var(--chw);border:0;padding-left:8px">' + time(nowMs()) + '</div>';
    for (var i = 0; i < n; i++) times.innerHTML += '<div style="width:calc((100% - var(--chw)) / ' + n + ')">' + time(windowStart + i * HALF) + '</div>';
    rows.innerHTML = '';
    channels.forEach(function (c, r) {
      if (!visible(r)) return;
      var row = document.createElement('div'); row.className = 'grow' + (r === current ? ' current' : '');
      row.innerHTML = '<div class="chan" title="Tap to tune. Tap the star to favourite."><b></b><span></span><i class="star" role="button" aria-label="Favourite"></i></div><div class="cells"></div>';
      row.querySelector('b').textContent = c.number; row.querySelector('span').textContent = c.name;
      var star = row.querySelector('.star'); star.textContent = isFav(c.channelId) ? '\u2605' : '\u2606';
      star.onclick = function (e) { e.stopPropagation(); toggleFav(c.channelId); };
      row.querySelector('.chan').onclick = function () { show($('guide'), false); tune(r); };
      var cells = row.querySelector('.cells');
      var programs = (guide[c.channelId] || []).filter(function (p) { return Date.parse(p.end) > windowStart && Date.parse(p.start) < wEnd; });
      programs.forEach(function (p, i) {
        var s = Math.max(Date.parse(p.start), windowStart), e = Math.min(Date.parse(p.end), wEnd);
        var el = document.createElement('div');
        var kids = /^(TV-Y|TV-Y7|TV-G|G)$/i.test(p.rating || '');
        el.className = 'cell' + (!p.itemId && !p.kind ? ' off' : p.movie ? ' movie' : kids ? ' kids' : '') + (r === focusRow && i === focusCol ? ' focus' : '');
        el.style.left = ((s - windowStart) / (wEnd - windowStart) * 100) + '%';
        el.style.width = 'calc(' + ((e - s) / (wEnd - windowStart) * 100) + '% - 2px)';
        var title = p.title || 'Off air';
        el.textContent = title + (p.movie && p.year && title.indexOf('(' + p.year + ')') < 0 ? ' (' + p.year + ')' : '');
        var sm = document.createElement('small'); sm.textContent = [p.episode, p.episodeTitle || p.artist].filter(Boolean).join(' - '); el.appendChild(sm);
        el.onclick = function () { focusRow = r; focusCol = i; select(); if (guideOpen()) renderGuide(); };
        cells.appendChild(el);
      });
      rows.appendChild(row);
    });
    var t = nowMs();
    if (t >= windowStart && t < wEnd) {
      var line = document.createElement('div'); line.id = 'now';
      line.style.left = 'calc(var(--chw) + (100% - var(--chw)) * ' + ((t - windowStart) / (wEnd - windowStart)) + ')';
      rows.appendChild(line);
    }
    var focusEl = rows.querySelector('.cell.focus'); if (focusEl) focusEl.scrollIntoView({ block: 'nearest' });
    showHint();
  }
  // What the focused programme is, so a tap or arrow key tells you more than the cell's one line.
  function showHint() {
    var p = programsAt(focusRow)[focusCol], c = channels[focusRow], t = nowMs();
    if (!p || !c) { $('hintText').textContent = ''; show($('hintWatch'), false); return; }
    var airing = Date.parse(p.start) <= t && Date.parse(p.end) > t;
    var title = (p.title || 'Off air') + (p.movie && p.year ? ' (' + p.year + ')' : '');
    var detail = [c.number + ' ' + c.name, time(Date.parse(p.start)) + ' \u2013 ' + time(Date.parse(p.end)), p.rating, [p.episode, p.episodeTitle || p.artist].filter(Boolean).join(' - '), p.premiere ? 'NEW' : ''].filter(Boolean).join(' \u00b7 ');
    $('hintText').textContent = '';
    var what = document.createElement('span'); what.textContent = title;
    var small = document.createElement('small'); small.textContent = detail + (airing || !p.itemId && !p.kind ? '' : ' \u00b7 starts later');
    $('hintText').appendChild(what); $('hintText').appendChild(small);
    show($('hintWatch'), airing && (p.itemId || p.kind), 'inline-block');
  }
  function programsAt(r) {
    var wEnd = windowStart + slots() * HALF;
    return (guide[channels[r].channelId] || []).filter(function (p) { return Date.parse(p.end) > windowStart && Date.parse(p.start) < wEnd; });
  }
  function openGuide() {
    focusRow = current; windowStart = 0;
    loadGuide().then(function () {
      buildCategories(); if (!visible(focusRow)) { category = ''; buildCategories(); }
      var t = nowMs(); focusCol = Math.max(0, programsAt(focusRow).findIndex(function (p) { return Date.parse(p.start) <= t && Date.parse(p.end) > t; }));
      show($('guide'), true, 'flex'); renderGuide();
    });
  }
  function select() {
    var p = programsAt(focusRow)[focusCol], t = nowMs();
    if (p && Date.parse(p.start) > t) { showHint(); return; }
    show($('guide'), false); tune(focusRow);
  }

  // ---- keys ----
  function commitDigits() {
    var n = digits; digits = ''; show($('digits'), false);
    var i = channels.findIndex(function (c) { return c.number === n || parseInt(c.number, 10) === parseInt(n, 10); });
    if (i >= 0) tune(i);
  }
  document.addEventListener('keydown', function (e) {
    if (!token || /^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(e.target.tagName)) return; // typing in the sign-in form
    if (resume()) { e.preventDefault(); return; }
    var guideShown = guideOpen();
    if (/^[0-9]$/.test(e.key) && !guideShown) {
      digits += e.key; $('digits').textContent = digits; show($('digits'), true);
      clearTimeout(digitTimer); digitTimer = setTimeout(commitDigits, 2000); return;
    }
    if (guideShown) {
      var rows = programsAt(focusRow);
      switch (e.key) {
        case 'ArrowDown': focusRow = stepRow(focusRow, 1); focusCol = Math.min(focusCol, Math.max(0, programsAt(focusRow).length - 1)); break;
        case 'ArrowUp': focusRow = stepRow(focusRow, -1); focusCol = Math.min(focusCol, Math.max(0, programsAt(focusRow).length - 1)); break;
        case 'ArrowRight': if (focusCol < rows.length - 1) focusCol++; else if (windowStart < nowMs() + 4 * 3600000) { windowStart += HALF; focusCol = Math.max(0, programsAt(focusRow).length - 1); } break;
        case 'ArrowLeft': if (focusCol > 0) focusCol--; else if (windowStart > nowMs() - HALF) { windowStart -= HALF; focusCol = 0; } break;
        case '*': toggleFav(channels[focusRow].channelId); break;
        case 'Enter': select(); return;
        case 'Escape': case 'g': case 'Backspace': show($('guide'), false); return;
        default: return;
      }
      e.preventDefault(); renderGuide(); return;
    }
    switch (e.key) {
      case 'ArrowUp': case 'PageUp': case 'ChannelUp': tune(current + 1); break;
      case 'ArrowDown': case 'PageDown': case 'ChannelDown': tune(current - 1); break;
      case 'Enter': case 'g': openGuide(); break;
      case 'i': case 'ArrowLeft': case 'ArrowRight': showBanner(); break;
      case 'f': toggleFullscreen(); break;
      case 'm': toggleMute(); break;
      case '*': toggleFav(channels[current].channelId); break;
      default: return;
    }
    e.preventDefault();
  });
  document.addEventListener('click', function (e) { if (resume()) return; if (e.target === video || e.target.id === 'card' || e.target.id === 'screen') { video.play().catch(function () {}); showBanner(); showControls(); } });
  // ---- controls (touch and mouse) ----
  var controlsTimer = null;
  function updateControls() {
    var c = channels[current]; if (!c) return;
    $('chLabel').textContent = c.number + ' ' + c.name;
    $('btnFav').textContent = isFav(c.channelId) ? '\u2605' : '\u2606';
    $('btnMute').textContent = video.muted ? 'Unmute' : 'Mute';
  }
  function showControls() {
    if (!token || guideOpen()) return;
    updateControls(); show($('controls'), true, 'flex');
    clearTimeout(controlsTimer); controlsTimer = setTimeout(function () { show($('controls'), false); }, 4500);
  }
  function toggleMute() { video.muted = !video.muted; try { localStorage.setItem('cabletv_web_muted', video.muted ? '1' : '0'); } catch (e) { /* session only */ } updateControls(); }
  function toggleFullscreen() {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iPhone: video-only full screen
  }
  try { video.muted = localStorage.getItem('cabletv_web_muted') === '1'; } catch (e) { /* default */ }
  $('btnUp').onclick = function () { tune(current + 1); showControls(); };
  $('btnDown').onclick = function () { tune(current - 1); showControls(); };
  $('btnGuide').onclick = function () { show($('controls'), false); openGuide(); };
  $('btnFav').onclick = function () { toggleFav(channels[current].channelId); showControls(); };
  $('btnMute').onclick = function () { toggleMute(); showControls(); };
  $('btnFull').onclick = function () { toggleFullscreen(); showControls(); };
  $('category').onchange = function () { category = this.value; focusRow = visible(focusRow) ? focusRow : firstVisible(); focusCol = 0; renderGuide(); };
  $('gClose').onclick = function () { show($('guide'), false); };
  $('gEarlier').onclick = function () { if (windowStart > nowMs() - HALF) { windowStart -= HALF; focusCol = 0; renderGuide(); } };
  $('gLater').onclick = function () { if (windowStart < nowMs() + 4 * 3600000) { windowStart += HALF; focusCol = 0; renderGuide(); } };
  $('gNow').onclick = function () { var t = nowMs(); windowStart = t - t % HALF; focusRow = visible(current) ? current : focusRow; renderGuide(); };
  $('hintWatch').onclick = function () { select(); };
  // Swipe up or down on the picture for the next or previous channel, like a remote's channel keys.
  var touch = null, screenEl = $('screen');
  screenEl.addEventListener('touchstart', function (e) {
    if (guideOpen() || e.target.closest('#controls') || e.touches.length !== 1) { touch = null; return; }
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  screenEl.addEventListener('touchend', function (e) {
    if (!touch) return;
    var t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y; touch = null;
    if (Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx) * 1.5) { tune(current + (dy < 0 ? 1 : -1)); showControls(); }
  }, { passive: true });
  var moved = 0;
  screenEl.addEventListener('mousemove', function () { var t = Date.now(); if (t - moved > 600) { moved = t; showControls(); } });
  window.addEventListener('resize', function () { if (guideOpen()) renderGuide(); });
  // Buttons shouldn't keep the keyboard: arrow keys and G go back to changing channel.
  document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('button.btn'); if (b) b.blur(); });
  setInterval(function () { $('clock').textContent = time(nowMs()); }, 1000);

  // ---- start ----
  var authHeader = 'MediaBrowser Client="Cable TV Web", Device="Browser", DeviceId="cabletv-web", Version="1"';
  function signIn() {
    show($('login'), true, 'flex');
    $('loginUser').focus();
    $('loginForm').onsubmit = function (e) {
      e.preventDefault();
      $('loginError').textContent = '';
      fetch(base + '/Users/AuthenticateByName', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: authHeader },
        body: JSON.stringify({ Username: $('loginUser').value, Pw: $('loginPass').value })
      }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (r) {
        token = r.AccessToken; userId = r.User.Id;
        try { localStorage.setItem('cabletv_web_auth', JSON.stringify({ token: token, userId: userId })); } catch (err) { /* session only */ }
        show($('login'), false);
        start();
      }).catch(function () { $('loginError').textContent = 'Wrong user name or password.'; });
    };
  }

  if (!token) { signIn(); return; }
  start();

  function start() {
  Promise.all([api('CableTv/Channels'), api('CableTv/Presentation').catch(function () { return {}; })]).then(function (r) {
    channels = r[0].channels;
    if (r[1].serviceName) { $('service').textContent = r[1].serviceName.toUpperCase(); document.title = r[1].serviceName; }
    if (!channels.length) { message('No Cable TV channels yet. Add some in Dashboard → Plugins → Cable TV.'); return; }
    var remembered = parseInt(localStorage.getItem('cabletv_web_channel') || '0', 10) || 0;
    tune(Math.min(remembered, channels.length - 1));
    window.addEventListener('beforeunload', function () { try { localStorage.setItem('cabletv_web_channel', String(current)); } catch (e) {} });
  }).catch(function (err) {
    // An expired or revoked token: sign in again.
    if (String(err.message) === '401') { try { localStorage.removeItem('cabletv_web_auth'); } catch (e) {} token = null; signIn(); return; }
    message('Couldn\'t reach the Cable TV plugin.');
  });
  }
})();
</script>
